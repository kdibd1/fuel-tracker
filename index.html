<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fuel Tracker">
  <title>Fuel Tracker</title>
  <style>
    :root{color-scheme:dark;--bg:#09111f;--panel:#111c2e;--panel2:#17243a;--text:#f5f7fb;--muted:#9eacc1;--line:#2b3a52;--accent:#52d39b;--accent2:#25a978;--danger:#ff6b6b;--shadow:0 18px 45px #0005}
    *{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#183352 0,transparent 38%),var(--bg)}
    button,input{font:inherit}button{cursor:pointer}.wrap{width:min(900px,100%);margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px max(36px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:13px;margin:3px 0 22px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--accent),#34b8d0);color:#07140f;font-size:25px;box-shadow:0 8px 25px #52d39b35}h1{font-size:clamp(1.55rem,5vw,2rem);margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:.92rem}
    .card{background:linear-gradient(145deg,var(--panel),#0e192a);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:17px}h2{font-size:1.05rem;margin:0 0 17px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field{display:grid;gap:7px}.wide{grid-column:1/-1}label{color:#dbe3ef;font-size:.88rem;font-weight:700}input{width:100%;min-height:51px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#0a1423;color:var(--text);outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #52d39b22}input::placeholder{color:#65738a}
    .primary,.secondary,.danger{min-height:52px;border-radius:14px;border:0;padding:12px 17px;font-weight:800}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#071811;box-shadow:0 8px 20px #25a97833}.primary:hover{filter:brightness(1.07)}.primary:active{transform:translateY(1px)}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#3b1d25;color:#ffb2b2;border:1px solid #6b2935}.actions{display:flex;gap:10px;margin-top:19px}.actions>*{flex:1}
    .result{display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:17px}.result.show{display:block}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#0a1423;border:1px solid var(--line);border-radius:15px;padding:14px 10px;text-align:center}.metric strong{display:block;font-size:clamp(1.05rem,4vw,1.35rem);color:var(--accent)}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:.76rem}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:var(--panel2);border-radius:14px;padding:14px 10px}.stat strong{display:block;font-size:1.06rem}.stat span{display:block;color:var(--muted);font-size:.72rem;margin-top:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-head h2{margin:0}.clear{border:0;background:transparent;color:#ff9b9b;font-weight:700;padding:10px}.clear:disabled{opacity:.35;cursor:not-allowed}
    .empty{color:var(--muted);text-align:center;padding:30px 10px}.history{display:grid;gap:11px}.entry{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:15px}.entry-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.entry-date{font-weight:800}.entry-main{color:var(--accent);font-size:1.08rem;font-weight:850;margin-top:4px}.entry-details{display:flex;flex-wrap:wrap;gap:7px 13px;color:var(--muted);font-size:.79rem;margin-top:11px}.delete{width:44px;height:44px;flex:0 0 auto;border:1px solid #63313a;border-radius:12px;background:#351d25;color:#ff9f9f;font-size:18px}footer{text-align:center;color:#718096;font-size:.76rem;margin-top:20px}
    .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,120px);padding:12px 18px;background:#e9fff5;color:#082117;border-radius:12px;font-weight:750;box-shadow:0 12px 35px #0008;transition:.25s;z-index:10}.toast.show{transform:translate(-50%,0)}
    @media(max-width:650px){.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.stat:first-child{grid-column:1/-1}.metrics{grid-template-columns:1fr}.metric{text-align:left;display:flex;align-items:baseline;justify-content:space-between}.metric span{margin:0}.card{padding:17px;border-radius:19px}.actions{flex-direction:column}.wrap{padding-left:12px;padding-right:12px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="logo" aria-hidden="true">⛽</div><div><h1>Fuel Tracker</h1><p>Know what every tank really costs.</p></div></header>
    <section class="card" aria-labelledby="fill-title">
      <h2 id="fill-title">Add a fill</h2>
      <form id="fillForm">
        <div class="form-grid">
          <div class="field"><label for="date">Fill date</label><input id="date" name="date" type="date" required></div>
          <div class="field"><label for="distance">Distance since last fill (km)</label><input id="distance" name="distance" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="e.g. 612.4" required></div>
          <div class="field"><label for="litres">Litres added (filled to full)</label><input id="litres" name="litres" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="e.g. 48.62" required></div>
          <div class="field"><label for="price">Fuel price (AUD per litre)</label><input id="price" name="price" type="number" inputmode="decimal" min="0.001" step="0.001" placeholder="e.g. 1.899" required></div>
        </div>
        <div id="result" class="result" aria-live="polite"><div class="metrics"><div class="metric"><strong id="rConsumption">—</strong><span>L/100 km</span></div><div class="metric"><strong id="rCostRate">—</strong><span>$/100 km</span></div><div class="metric"><strong id="rCost">—</strong><span>fill cost</span></div></div></div>
        <div class="actions"><button class="primary" type="submit">Save fill</button><button class="secondary" type="reset">Reset</button></div>
      </form>
    </section>
    <section class="card" aria-labelledby="overall-title"><h2 id="overall-title">Overall averages</h2><div class="stats"><div class="stat"><strong id="avgConsumption">—</strong><span>weighted L/100 km</span></div><div class="stat"><strong id="avgCost">—</strong><span>weighted $/100 km</span></div><div class="stat"><strong id="totalDistance">0 km</strong><span>total distance</span></div><div class="stat"><strong id="totalLitres">0 L</strong><span>total litres</span></div><div class="stat"><strong id="totalSpend">$0.00</strong><span>total spend</span></div></div></section>
    <section class="card" aria-labelledby="history-title"><div class="section-head"><h2 id="history-title">Fill history</h2><button id="clearAll" class="clear" type="button">Clear all</button></div><div id="history" class="history"></div></section>
    <footer>Your fill history stays on this device in this browser.</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite">Fill saved</div>
  <script>
    (() => {
      'use strict';
      const KEY='fuelTracker.entries.v1';
      const $=id=>document.getElementById(id);
      const form=$('fillForm'), date=$('date'), distance=$('distance'), litres=$('litres'), price=$('price'), result=$('result');
      const money=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'});
      const number=(n,d=1)=>new Intl.NumberFormat('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
      const today=()=>{const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};
      const read=()=>{try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(data)?data:[]}catch{return []}};
      const write=items=>localStorage.setItem(KEY,JSON.stringify(items));
      let entries=read(); date.value=today();
      function values(){const d=Number(distance.value),l=Number(litres.value),p=Number(price.value);return {d,l,p,valid:d>0&&l>0&&p>0}}
      function preview(){const v=values();result.classList.toggle('show',v.valid);if(!v.valid)return;$('rConsumption').textContent=number(v.l/v.d*100,2);$('rCostRate').textContent=money.format(v.l*v.p/v.d*100);$('rCost').textContent=money.format(v.l*v.p)}
      [distance,litres,price].forEach(el=>el.addEventListener('input',preview));
      form.addEventListener('reset',()=>setTimeout(()=>{date.value=today();result.classList.remove('show');},0));
      form.addEventListener('submit',e=>{e.preventDefault();const v=values();if(!v.valid||!date.value){form.reportValidity();return}entries.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:date.value,distance:v.d,litres:v.l,price:v.p});write(entries);render();form.reset();showToast('Fill saved')});
      $('clearAll').addEventListener('click',()=>{if(entries.length&&confirm('Delete every saved fill? This cannot be undone.')){entries=[];write(entries);render();showToast('History cleared')}});
      $('history').addEventListener('click',e=>{const btn=e.target.closest('[data-delete]');if(!btn)return;const item=entries.find(x=>x.id===btn.dataset.delete);if(item&&confirm('Delete this fill from '+formatDate(item.date)+'?')){entries=entries.filter(x=>x.id!==item.id);write(entries);render();showToast('Fill deleted')}});
      function formatDate(s){return new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T00:00:00Z'))}
      function render(){
        const totals=entries.reduce((a,x)=>({distance:a.distance+x.distance,litres:a.litres+x.litres,spend:a.spend+x.litres*x.price}),{distance:0,litres:0,spend:0});
        $('avgConsumption').textContent=totals.distance?number(totals.litres/totals.distance*100,2):'—';
        $('avgCost').textContent=totals.distance?money.format(totals.spend/totals.distance*100):'—';
        $('totalDistance').textContent=number(totals.distance,1)+' km';$('totalLitres').textContent=number(totals.litres,2)+' L';$('totalSpend').textContent=money.format(totals.spend);$('clearAll').disabled=!entries.length;
        if(!entries.length){$('history').innerHTML='<div class="empty">No fills saved yet.<br>Your first one will appear here.</div>';return}
        $('history').innerHTML=entries.map(x=>{const use=x.litres/x.distance*100,cost=x.litres*x.price,rate=cost/x.distance*100;return '<article class="entry"><div class="entry-top"><div><div class="entry-date">'+formatDate(x.date)+'</div><div class="entry-main">'+number(use,2)+' L/100 km · '+money.format(rate)+'/100 km</div></div><button class="delete" type="button" data-delete="'+x.id+'" aria-label="Delete fill from '+formatDate(x.date)+'">✕</button></div><div class="entry-details"><span>'+number(x.distance,1)+' km</span><span>'+number(x.litres,2)+' L</span><span>'+money.format(x.price)+'/L</span><span>'+money.format(cost)+' total</span></div></article>'}).join('');
      }
      let toastTimer;function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
      render();
    })();
  </script>
</body>
</html>
